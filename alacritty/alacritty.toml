# Shared Alacritty config. OS-specific settings live in os.toml, which the
# installer symlinks to alacritty.macos.toml or alacritty.linux.toml.
[general]
import = ["os.toml"]

[window]
opacity = 0.95

[window.padding]
x = 8
y = 8

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold Italic" }
size = 14.0

# Login shell; uses $SHELL so it works on macOS and Linux.
[terminal.shell]
program = "zsh"
args = ["-l"]
